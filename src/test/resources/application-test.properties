spring.datasource.url=jdbc:h2:mem:readyplz_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

jwt.secret=test-jwt-secret-key-must-be-long-enough-for-hs256
jwt.secret-encoding=UTF8
jwt.access-token-validity=3600000
jwt.refresh-token-validity=86400000

app.cors.allowed-origin-patterns[0]=http://localhost:*
