spring.application.name=ReadyPlz

# --- 서버 ---
server.port=8080
# TLS가 앞단 프록시에서 끝나면 X-Forwarded-Proto를 반영한다.
# Boot 3.2는 이 값이 없으면 전달 헤더를 무시한다. framework는 ForwardedHeaderFilter를 등록한다.
# 앱은 신뢰하는 프록시 뒤에서만 이 헤더를 받아야 한다.
server.forward-headers-strategy=framework

# 로컬 MySQL·Redis는 dev 프로필(application-dev.properties)에서만 설정한다.

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- 메일 ( 미사용 시에도 기본값이 없기에 발송 시점에 실패합니다) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8

# 비밀번호 재설정 메일 본문 링크에 사용
# 이전 공개 주소이며 현재는 운영하지 않는다.
app.external.base-url=https://readyplz.com

# --- 관리자용 Steam 게임 JSON 적재 ---
app.games.import.data-location=classpath:steam_games_data.json
app.games.import.batch-size=1000

# HTTP CORS 및 WebSocket(STOMP/SockJS) 핸드셰이크에 공통 적용
app.cors.allowed-origin-patterns[0]=https://readyplz.com
app.cors.allowed-origin-patterns[1]=https://www.readyplz.com
app.cors.allowed-origin-patterns[2]=https://*.readyplz.com

# --- 1:1 대화당 메시지 보존 (전역 한도 대신 대화 쌍 단위) ---
app.messages.max-per-conversation=1000
app.messages.trim-batch-size=10


# 운영/기본: 환경 변수 JWT_SECRET (또는 실행 환경의 동일 키 jwt.secret).
# 로컬 개발(dev 프로필): application-local.properties 또는 JWT_SECRET 참고(application-dev.properties).
jwt.secret-encoding=BASE64
jwt.access-token-validity=3600000
jwt.refresh-token-validity=604800000
