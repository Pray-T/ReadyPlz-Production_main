# 로컬 개발 프로필 — application.properties 위 덮어쓰기

# Git 제외 파일 application-local.properties 에 jwt.secret 등 로컬 비밀값 (선택)
spring.config.import=optional:classpath:application-local.properties

# JWT: JWT_SECRET 환경 변수를 두거나, 위 로컬 파일에 jwt.secret 을 설정하세요.

# 로컬 Origin (CORS / WebSocket)
app.cors.allowed-origin-patterns[0]=http://localhost:*

app.cors.allowed-origin-patterns[1]=http://127.0.0.1:*

app.cors.allowed-origin-patterns[2]=https://readyplz.com

app.cors.allowed-origin-patterns[3]=https://www.readyplz.com

app.cors.allowed-origin-patterns[4]=https://*.readyplz.com


# 로컬에서 메일 링크·API 호출 기준 URL
app.external.base-url=http://localhost:8080

# 로컬 DB 이름 분리 (선택)
spring.datasource.url=jdbc:mysql://localhost:3306/readyplz_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8

# 대용량 JSON을 파일로 두는 경우 예시:
# app.games.import.data-location=file:${user.home}/steam_games_data.json

spring.jpa.show-sql=true
