# 이 프로젝트는 운영하지 않으며, 이 파일은 로컬 MySQL 개발용이다. 로컬 MySQL은 TLS 인증서가 없어 SSL을 끈다.

# 로컬 개발 프로필 — application.properties 위 덮어쓰기

# Git 제외 파일 application-local.properties 에 jwt.secret 등 로컬 비밀값 (선택)
spring.config.import=optional:classpath:application-local.properties

# JWT: JWT_SECRET 환경 변수를 두거나, 위 로컬 파일에 jwt.secret 을 설정하세요.

# 로컬 Origin (CORS / WebSocket). 기본 파일의 [0]~[2]는 유지하고 로컬만 추가한다.
app.cors.allowed-origin-patterns[3]=http://localhost:*
app.cors.allowed-origin-patterns[4]=http://127.0.0.1:*

# 로컬에서 메일 링크·API 호출 기준 URL
app.external.base-url=http://localhost:8080

spring.datasource.url=jdbc:mysql://localhost:3306/readyplz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=readyplz
spring.datasource.password=readyplz

# 로컬 Redis는 비밀번호를 쓰지 않는다
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 대용량 JSON을 파일로 두는 경우 예시:
# app.games.import.data-location=file:${user.home}/steam_games_data.json

spring.jpa.show-sql=true
